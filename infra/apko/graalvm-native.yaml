# This image is meant to be used as a base image only, with just enough files to run native GraalVM native-image binaries
# https://images.chainguard.dev/directory/image/graalvm-native/specifications
# https://images.chainguard.dev/directory/image/graalvm-native/sbom
includes: .dev.yaml
contents:
  packages:
    - tzdata
    - zlib
    - glibc
    - libstdc++-dev

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532
