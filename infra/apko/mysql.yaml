# https://github.com/wolfi-dev/os/blob/main/mysql-9.5.yaml
# https://github.com/docker-library/mysql/blob/master/innovation/Dockerfile.oracle
# https://github.com/docker-library/mysql/blob/master/innovation/docker-entrypoint.sh
# https://github.com/docker-library/mysql/blob/master/8.4/Dockerfile.oracle
# https://github.com/docker-library/mysql/blob/master/8.4/docker-entrypoint.sh
# https://images.chainguard.dev/directory/image/mysql/specifications
# https://images.chainguard.dev/directory/image/mysql/sbom
includes: .base.yaml
contents:
  packages:
    - mysql-9.5
    - mysql-9.5-dev
    - mysql-9.5-oci-entrypoint
    - mysql-9.5-oci-entrypoint-compat

accounts:
  groups:
    - groupname: mysql
      gid: 65532
  users:
    - username: mysql
      uid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/docker-entrypoint.sh mysqld

paths:
  - path: /var/lib/mysql
    type: directory
    permissions: 511 # 0777
    uid: 65532
    gid: 65532
  - path: /var/tmp
    type: directory
    permissions: 511 # 0777
    uid: 65532
    gid: 65532
  - path: /run/mysqld
    type: directory
    permissions: 511 # 0777
    uid: 65532
    gid: 65532
  - path: /docker-entrypoint-initdb.d
    type: directory
    permissions: 511 # 0777
    uid: 65532
    gid: 65532
