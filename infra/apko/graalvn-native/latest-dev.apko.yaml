# This image is meant to be used as a base image only, with just enough files to run native GraalVM native-image binaries
# https://images.chainguard.dev/directory/image/graalvm-native/specifications
# https://images.chainguard.dev/directory/image/graalvm-native/sbom
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - ca-certificates-bundle
    - wolfi-baselayout
    - glibc-locale-posix
    - tzdata
    - zlib
    - glibc
    - libstdc++-dev
    # dev
    - apk-tools
    - busybox
    - bash
    - git
    - wget

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

archs:
  - x86_64
  - aarch64
