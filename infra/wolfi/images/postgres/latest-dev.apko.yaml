# https://github.com/chainguard-images/images/blob/main/images/postgres/main.tf
# https://github.com/chainguard-images/images/blob/main/images/postgres/config/main.tf
# https://images.chainguard.dev/directory/image/postgres/specifications
# https://images.chainguard.dev/directory/image/postgres/sbom
# https://github.com/wolfi-dev/os/blob/main/postgresql-18.yaml
# https://github.com/docker-library/postgres/blob/master/18/alpine3.23/Dockerfile
# https://github.com/docker-library/postgres/blob/master/18/alpine3.23/docker-entrypoint.sh
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - ca-certificates-bundle
    - wolfi-baselayout
    - glibc-locale-posix
    - posix-libc-utils # Needed to fetch locale
    - glibc-locale-en # required for initdb entrypoint
    - busybox # required for initdb entrypoint
    - gosu # Needed by entrypoint
    - postgresql
    - postgresql-client
    - postgresql-oci-entrypoint
    - postgresql-contrib
    - libpq
    - pgaudit
    - perl
    # - nss_wrapper # https://access.redhat.com/articles/4859371
    # dev
    - apk-tools
    - bash
    - git
    - wget

environment:
  LANG: en_US.UTF-8
  PGDATA: /var/lib/postgresql/data
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

entrypoint:
  command: /usr/bin/docker-entrypoint.sh postgres

work-dir: /home/postgres

accounts:
  groups:
    - groupname: postgres
      gid: 70
  users:
    - username: postgres
      uid: 70
      gid: 70
  run-as: 0

paths:
  - path: /var/lib/postgresql
    type: directory
    uid: 70
    gid: 70
    permissions: 511 # 0777
    recursive: true
  - path: /var/run/postgresql
    type: directory
    uid: 70
    gid: 70
    permissions: 511 # 0777
    recursive: true

archs:
  - x86_64
  - aarch64
