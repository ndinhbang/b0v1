# https://github.com/wolfi-dev/os/blob/main/memcached.yaml
# https://images.chainguard.dev/directory/image/memcached/specifications
# https://images.chainguard.dev/directory/image/memcached/sbom
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - ca-certificates-bundle
    - wolfi-baselayout
    - glibc-locale-posix
    - busybox
    - memcached
    # dev
    - apk-tools
    - bash
    - git
    - wget

accounts:
  groups:
    - groupname: memcached
      gid: 65532
  users:
    - username: memcached
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/memcached

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

archs:
  - x86_64
  - aarch64
