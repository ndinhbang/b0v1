# https://images.chainguard.dev/directory/image/temporal-server/specifications
# https://images.chainguard.dev/directory/image/temporal-server/sbom
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - ca-certificates-bundle
    - wolfi-baselayout
    - glibc-locale-posix
    - dockerize
    - temporal
    - temporal-compat
    - temporal-server
    - temporal-server-compat
    - temporal-server-oci-entrypoint
    - temporal-docker-builds
    - bash
    # dev
    - apk-tools
    - busybox
    - git
    - wget

accounts:
  groups:
    - groupname: temporal
      gid: 1000
  users:
    - username: temporal
      uid: 1000
      gid: 1000
  run-as: 1000

entrypoint:
  command: /etc/temporal/entrypoint.sh

work-dir: /etc/temporal

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  TEMPORAL_HOME: /etc/temporal

paths:
  - path: /etc/temporal
    type: directory
    permissions: 493 # 0755
    uid: 1000
    gid: 1000
    recursive: true

archs:
  - x86_64
  - aarch64
