# https://images.chainguard.dev/directory/image/keycloak/specifications
# https://images.chainguard.dev/directory/image/keycloak/sbom
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - ca-certificates-bundle
    - wolfi-baselayout
    - glibc-locale-posix
    - keycloak
    - keycloak-compat
    - busybox
    # dev
    - apk-tools
    - bash
    - git
    - wget

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/kc.sh

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  KC_HEALTH_ENABLED: "true"
  KC_RUN_IN_CONTAINER: "true"

paths:
  - path: /usr/share/java/keycloak
    type: directory
    permissions: 511 # 0777
    uid: 65532
    gid: 65532
    recursive: true
  - path: /usr/share/java/keycloak/lib/quarkus
    type: directory
    permissions: 511 # 0777
    uid: 65532
    gid: 65532
    recursive: true
  - path: /opt/keycloak
    type: directory
    permissions: 511 # 0777
    uid: 65532
    gid: 65532
    recursive: true

archs:
  - x86_64
  - aarch64
