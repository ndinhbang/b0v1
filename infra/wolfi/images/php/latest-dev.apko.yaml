# https://github.com/chainguard-dev/apko/blob/main/docs/apko_file.md
# https://github.com/chainguard-images/images/blob/main/BEST_PRACTICES.md
# https://github.com/wolfi-dev/os/blob/main/php-8.4.yaml
# https://images.chainguard.dev/directory/image/php/specifications
# https://images.chainguard.dev/directory/image/php/sbom
# https://github.com/chainguard-images/images/blob/main/images/php/config/main.tf
# https://github.com/chainguard-images/images/blob/main/images/php/main.tf
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - ca-certificates-bundle
    - wolfi-baselayout
    - glibc-locale-posix
    - ca-certificates
    - curl
    - php
    - php-curl
    - php-openssl
    - php-mbstring
    - php-iconv
    - php-mysqlnd
    - php-pdo
    - php-pdo_mysql
    - php-pdo_sqlite
    - php-sodium
    - php-phar
    # Additional extensions
    # - php-apache
    # - php-apcu
    # - php-gd
    # - php-grpc
    # - php-igbinary
    # - php-intl
    # - php-opcache
    # - php-opentelemetry
    # - php-pcntl
    # - php-pdo_pgsql
    # - php-protobuf
    # - php-redis
    # - php-swoole
    # - php-zip
    # - php-zstd
    # - php-xdebug
    # dev
    - composer
    - apk-tools
    - busybox
    - bash
    - git
    - wget

entrypoint:
  command: /bin/php

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

paths:
  - path: /app
    type: directory
    permissions: 511 # 0777
    uid: 65532
    gid: 65532

work-dir: /app

accounts:
  groups:
    - groupname: php
      gid: 65532
  users:
    - username: php
      uid: 65532
      gid: 65532
  run-as: 65532

archs:
  - x86_64
  - aarch64
