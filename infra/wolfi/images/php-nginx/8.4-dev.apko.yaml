# https://github.com/chainguard-dev/apko/blob/main/docs/apko_file.md
# https://github.com/chainguard-images/images/blob/main/BEST_PRACTICES.md
# https://github.com/wolfi-dev/os/blob/main/php-8.4.yaml
# https://github.com/chainguard-images/images/blob/main/images/laravel/config/main.tf
# https://github.com/chainguard-images/images/blob/main/images/laravel/main.tf
# https://images.chainguard.dev/directory/image/laravel/sbom
# https://images.chainguard.dev/directory/image/laravel/specifications
# https://github.com/wolfi-dev/os/blob/main/nginx-mainline.yaml
# https://github.com/nginx/nginx/tree/master
# https://nginx.org/en/docs/configure.html
# https://github.com/wolfi-dev/os/blob/main/nginx-mainline/nginx.conf
# https://github.com/chainguard-images/images/blob/main/images/nginx/config/main.tf
# https://github.com/chainguard-images/images/blob/main/images/nginx/main.tf
# https://images.chainguard.dev/directory/image/nginx/sbom
# https://images.chainguard.dev/directory/image/nginx/specifications
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - ca-certificates-bundle
    - wolfi-baselayout
    - glibc-locale-posix
    - nginx-mainline
    - nginx-mainline-package-config
    - ca-certificates
    - curl
    - php-8.4
    - php-8.4-ctype
    - php-8.4-curl
    - php-8.4-dom
    - php-8.4-fileinfo
    - php-8.4-fpm
    - php-8.4-iconv
    - php-8.4-mbstring
    - php-8.4-mysqlnd
    - php-8.4-openssl
    - php-8.4-pdo
    - php-8.4-pdo_mysql
    - php-8.4-pdo_sqlite
    - php-8.4-phar
    - php-8.4-simplexml
    - php-8.4-sodium
    - php-8.4-xml
    - php-8.4-zip
    # dev
    - composer
    - php-8.4-xmlwriter
    - apk-tools
    - busybox
    - bash
    - git
    - wget
    # Additional extensions
    # - php-8.4-apcu
    # - php-8.4-gd
    # - php-8.4-grpc
    # - php-8.4-igbinary
    # - php-8.4-intl
    # - php-8.4-opcache
    # - php-8.4-opentelemetry
    # - php-8.4-pcntl
    # - php-8.4-pdo_pgsql
    # - php-8.4-protobuf
    # - php-8.4-redis
    # - php-8.4-swoole
    # - php-8.4-zstd
    # - php-8.4-xdebug

entrypoint:
  type: service-bundle
  services:
    nginx: /usr/sbin/nginx -c /etc/nginx/nginx.conf -e /dev/stderr -g "daemon off;"
    php-fpm: /usr/sbin/php-fpm

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

work-dir: /app

# # Set stop signal to SIGQUIT for a graceful shutdown instead of S6's preferred SIGTERM (https://github.com/just-containers/s6-overlay/issues/586)
stop-signal: SIGQUIT

accounts:
  groups:
    - groupname: nginx
      gid: 65532
  users:
    - username: nginx
      uid: 65532
      gid: 65532
    - username: laravel
      uid: 1000
      gid: 1000

  run-as: 65532

paths:
  - path: /app
    type: directory
    permissions: 511 # 0777
    # permissions: 493 # Change to 0755 in production
    uid: 65532
    gid: 65532
  - path: /var/lib/nginx
    type: directory
    uid: 65532
    gid: 65532
    permissions: 493 # 0755
    recursive: true
  - path: /var/lib/nginx/tmp
    uid: 65532
    gid: 65532
    type: directory
    # Wide permissions required for running with tmpfs. Seems to be related to Docker bug https://github.com/moby/moby/issues/40881
    # https://github.com/docker/for-linux/issues/138
    permissions: 511 # 0777
    recursive: true
  - path: /var/run
    uid: 65532
    gid: 65532
    type: directory
    # Wide permissions required for running with tmpfs. Seems to be related to Docker bug https://github.com/moby/moby/issues/40881
    # https://github.com/docker/for-linux/issues/138
    permissions: 511 # 0777
    recursive: false
  # The pid path was switched from /var/run/nginx.pid to /run/nginx.pid here
  # https://github.com/wolfi-dev/os/pull/62917
  - path: /run
    uid: 65532
    gid: 65532
    type: directory
    permissions: 511 # 0777
    recursive: false

archs:
  - x86_64
  - aarch64
