# https://github.com/chainguard-dev/apko/blob/main/docs/apko_file.md
# https://github.com/chainguard-images/images/blob/main/BEST_PRACTICES.md
# https://github.com/wolfi-dev/os/blob/main/php-8.4.yaml
# https://github.com/chainguard-images/images/blob/main/images/laravel/config/main.tf
# https://github.com/chainguard-images/images/blob/main/images/laravel/main.tf
# https://images.chainguard.dev/directory/image/laravel/sbom
# https://images.chainguard.dev/directory/image/laravel/specifications
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - ca-certificates-bundle
    - wolfi-baselayout
    - glibc-locale-posix
    - ca-certificates
    - curl
    - php
    - php-ctype
    - php-curl
    - php-dom
    - php-fileinfo
    - php-fpm
    - php-iconv
    - php-mbstring
    - php-mysqlnd
    - php-openssl
    - php-pdo
    - php-pdo_mysql
    - php-pdo_sqlite
    - php-phar
    - php-simplexml
    - php-sodium
    - php-xml
    # - php-zip
    #  dev
    - composer
    - php-xmlwriter
    - apk-tools
    - busybox
    - bash
    - git
    - wget
    # - php-xdebug

entrypoint:
  type: service-bundle
  services:
    php-fpm: /usr/bin/php-fpm

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

paths:
  - path: /app
    type: directory
    permissions: 511 # 0777
    uid: 65532
    gid: 65532

work-dir: /app

accounts:
  groups:
    - groupname: php
      gid: 65532
  users:
    - username: php
      uid: 65532
      gid: 65532
    - username: laravel
      uid: 1000
      gid: 1000
  run-as: 65532

archs:
  - x86_64
  - aarch64
