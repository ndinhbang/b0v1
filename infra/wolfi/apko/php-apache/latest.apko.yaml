# https://github.com/wolfi-dev/os/blob/main/apache2.yaml
# https://httpd.apache.org/docs/2.4/programs/configure.html
# https://github.com/docker-library/httpd/blob/master/2.4/alpine/Dockerfile
# https://github.com/docker-library/httpd/blob/master/2.4/Dockerfile
# https://images.chainguard.dev/directory/image/httpd/sbom
# https://images.chainguard.dev/directory/image/httpd/specifications
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - ca-certificates-bundle
    - wolfi-baselayout
    - glibc-locale-posix
    - apache2
    - apache2-compat
    - ca-certificates
    - curl
    - php
    - php-apache
    - php-ctype
    - php-curl
    - php-dom
    - php-fileinfo
    - php-fpm
    - php-iconv
    - php-mbstring
    - php-mysqlnd
    - php-openssl
    - php-pdo
    - php-pdo_mysql
    - php-pdo_sqlite
    - php-phar
    - php-simplexml
    - php-sodium
    - php-xml
    - php-zip
    # Additional extensions
    # - php-apcu
    # - php-gd
    # - php-grpc
    # - php-igbinary
    # - php-intl
    # - php-opcache
    # - php-opentelemetry
    # - php-pcntl
    # - php-pdo_pgsql
    # - php-protobuf
    # - php-redis
    # - php-swoole
    # - php-zstd
    # - php-xdebug

entrypoint:
  type: service-bundle
  services:
    apache: /usr/local/bin/httpd-foreground
    php-fpm: /usr/sbin/php-fpm

work-dir: /app

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

stop-signal: SIGWINCH

accounts:
  groups:
    - groupname: www-data
      gid: 65532
  users:
    - username: www-data
      uid: 65532
      gid: 65532
  run-as: 65532

paths:
  - path: /app
    type: directory
    permissions: 493 # 0755
    uid: 65532
    gid: 65532
  - path: /usr/local/apache2/var/run/apache2
    type: directory
    uid: 65532
    gid: 65532
    permissions: 493 # 0755
    recursive: true

archs:
  - x86_64
  - aarch64
