server {
    listen 8443 ssl default_server reuseport;
    listen [::]:8443 ssl default_server reuseport;
    http2 on;

    # ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_certificate /etc/ssl/certs/localhost.pem;
    ssl_certificate_key /etc/ssl/certs/localhost-key.pem;

    # https://wiki.mozilla.org/Security/Server_Side_TLS
    # https://ssl-config.mozilla.org/
    ssl_protocols TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_prefer_server_ciphers off;

    # uncomment to enable if ssl_protocols includes TLSv1.2 or earlier;
    # ssl_session_timeout 1d;
    # ssl_session_cache shared:SSL:10m; # about 40000 sessions
    # ssl_session_tickets off;

    root /app/public;
    # Set allowed "index" files
    index index.html index.php;

    server_name _;

    charset utf-8;

    absolute_redirect off;

    # Healthcheck: Set /healthcheck to be the static health check URL
    location /healthcheck {
        access_log off;

        # set max 5 seconds for healthcheck
        fastcgi_read_timeout 5s;

        include fastcgi_params;
        fastcgi_param SCRIPT_NAME /healthcheck;
        fastcgi_param SCRIPT_FILENAME /healthcheck;
        fastcgi_pass app:9000;
    }
    # Have NGINX try searching for PHP files as well
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    # Block PHP execution in storage directory to prevent uploaded malicious PHP files from running
    # Reference: Livewire arbitrary file upload (GHSA-29cq-5w36-x7w3)
    location ~* ^/storage/.*\.php$ {
        deny all;
    }
    # Pass "*.php" files to PHP-FPM
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;
        # 4k/8k determined by the platform memory page size.
        # https://gist.github.com/ikennaokpala/5792a71cfae6818035eedc8abd9ae7b4#setting-buffer-size
        fastcgi_buffers 8 8k;
        fastcgi_buffer_size 8k;
        # same as php max_execution_time
        fastcgi_read_timeout 60;
        # Hide PHP headers
        fastcgi_hide_header X-Powered-By;
        fastcgi_hide_header X-CF-Powered-By;
    }
}
