##
# Security Configuration
##

# This configuration follows security best practices from:
#
#   H5BP Server Configs (nginx)
#   https://github.com/h5bp/server-configs-nginx
#
#   OWASP Secure Headers Project
#   https://owasp.org/www-project-secure-headers/
#
#   RFC 8615 - Well-Known URIs
#   https://www.rfc-editor.org/rfc/rfc8615
#
# ##############################################################################

# Prevent clickjacking attacks by disabling iframe embedding
# https://owasp.org/www-project-secure-headers/#x-frame-options
add_header X-Frame-Options "SAMEORIGIN" always;

# Prevent MIME type sniffing attacks
# https://owasp.org/www-project-secure-headers/#x-content-type-options
add_header X-Content-Type-Options "nosniff" always;

# Control referrer information sent with requests
# https://owasp.org/www-project-secure-headers/#referrer-policy
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Enable HTTP Strict Transport Security (HSTS)
# https://owasp.org/www-project-secure-headers/#strict-transport-security
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Cross-Origin-Opener-Policy allows you to ensure a top-level document does
# not share a browsing context group with cross-origin documents.
# https://owasp.org/www-project-secure-headers/#cross-origin-opener-policy
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Cross-Origin-Embedder-Policy prevents a document from loading any cross-origin resources
# that don't explicitly grant the document permission.
# https://owasp.org/www-project-secure-headers/#cross-origin-embedder-policy
add_header Cross-Origin-Embedder-Policy "require-corp" always;

# Cross-Origin-Resource-Policy allows to define a policy that lets web sites and applications opt in
# to protection against certain requests from other origins, to mitigate speculative side-channel attacks.
# https://owasp.org/www-project-secure-headers/#cross-origin-resource-policy
add_header Cross-Origin-Resource-Policy "same-origin" always;

# add_header Content-Security-Policy "object-src 'none'; base-uri 'none'; default-src 'self' https://$host wss://ws.$host; style-src-elem 'self' 'unsafe-inline'; require-trusted-types-for 'script'; script-src 'self' 'wasm-unsafe-eval';" always;


# ------------------------------------------------------------------------------
# | File Access Restrictions                                                   |
# ------------------------------------------------------------------------------

# Block access to hidden files and directories (dotfiles)
# EXCEPT for the "/.well-known/" directory which is required by RFC 8615
# for ACME challenges, security.txt, and other standardized endpoints.
# https://www.rfc-editor.org/rfc/rfc8615
# https://github.com/h5bp/server-configs-nginx
location ~ /\.(?!well-known) {
    deny all;
}

# Block access to files that may expose sensitive information
# Based on H5BP server configs: https://github.com/h5bp/server-configs-nginx
location ~* (?:#.*#|\.(?:bak|conf|config|dist|inc|ini|log|sh|sql|sw[op])|~)$ {
    deny all;
}
